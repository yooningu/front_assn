<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

    <style>
      /* 1. 기본 전체 화면 세팅 */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;

      }

      /* 모바일 100vh 버그 방지용: JS에서 --vh 갱신 */
      :root {
        --vh: 1vh;
      }

      /* 2. 스캔용 캔버스: 화면 전체 덮기 */
      
      a-scene  {
        width: 100%;
        height: 100%;
        pointer-events: none;
        background: transparent;
        display: block;
        margin: 0 auto;
      }

      /* 3. a-scene도 화면 전체 */
     

      /* 4. 헤더는 위에 띄워서 덮는 느낌으로 */
      #header {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1000;
        color: #fff;
        background: rgba(0, 0, 0, 0.5);
        padding: 8px 12px;
        font-size: 16px;
      }
    </style>

    <script>
      // 모바일 주소창 때문에 100vh가 잘 안 맞는 문제 해결
      function setVh() {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty("--vh", `${vh}px`);
      }
      window.addEventListener("load", setVh);
      window.addEventListener("resize", setVh);
    </script>
  </head>

  <body>
    <header id="header">
      삼전
    </header>

    <!-- AR 씬 -->
    <a-scene id="aaa"
      mindar-image="imageTargetSrc: ./mind/new.mind;filterMinCF:0.0001;filterBeta:0.3; uiScanning: #scanning; maxTrack: 12"
      color-space="sRGB"
      renderer=" colorManagement: true; physicallyCorrectLights: true; antialias: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <a-asset-item id="p-cat" src="./glb/p1.glb"></a-asset-item>
        <a-asset-item id="cat-glb" src="./glb/lods_-_samsung-7kg-ww70t4020cx.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- 타겟 0 -->
      <a-entity mindar-image-target="targetIndex: 0" play-video-on-target>
        <a-entity light="type: directional; intensity: 6; color: #ffffff" position="0 4 20"></a-entity>
        <a-entity light="type: directional; intensity: 3; color: #ff8800" position="0 -3 10"></a-entity>
        <a-entity light="type: ambient; intensity: 1.5; color: #aa66ff"></a-entity>

        <a-gltf-model rotation="0 0 0" position="0 0 0.2" scale="0.5 0.5 0.5" src="#p-cat"></a-gltf-model>
      </a-entity>

      <!-- 타겟 1 -->
      <a-entity mindar-image-target="targetIndex: 1" play-video-on-target>
        <a-entity light="type: directional; intensity: 6; color: #ffffff" position="0 4 20"></a-entity>
        <a-entity light="type: directional; intensity: 3; color: #ff8800" position="0 -3 10"></a-entity>
        <a-entity light="type: ambient; intensity: 1.5; color: #aa66ff"></a-entity>

        <a-gltf-model rotation="0 0 0" position="0 0 0.2" scale="0.5 0.5 0.5" src="#cat-glb"></a-gltf-model>
      </a-entity>

    </a-scene>
  </body>
</html>
